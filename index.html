<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Laluan khas untuk usahawan serta pemimpin NGO, koperasi dan organisasi yang mahu membawa pengalaman mereka ke tahap kelayakan yang lebih tinggi. Coach Roszie dan Team SPM2Diploma di bawah KOBIS Berhad bersama anda sepanjang perjalanan."
    />
    <!-- Open Graph (WhatsApp / Facebook / LinkedIn link previews) -->
    <meta property="og:site_name" content="SPM2Diploma" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spm2diploma.uk/" />
    <meta property="og:title" content="SPM2Diploma — Guna Pengalaman Jadi Diploma" />
    <meta
      property="og:description"
      content="Dua laluan Diploma Kemahiran Malaysia untuk usahawan dan pemimpin organisasi berpengalaman. Semak kelayakan anda hari ini."
    />
    <meta property="og:image" content="https://spm2diploma.uk/og.png" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SPM2Diploma — Guna Pengalaman Jadi Diploma" />
    <meta
      name="twitter:description"
      content="Dua laluan Diploma Kemahiran Malaysia untuk usahawan dan pemimpin organisasi berpengalaman. Semak kelayakan anda hari ini."
    />
    <meta name="twitter:image" content="https://spm2diploma.uk/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/SourceSerif4-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/HankenGrotesk-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <!--
      Netlify Forms: hidden static form so Netlify's build bot registers the
      "eligibility" form. The React app submits to it via fetch
      (src/lib/netlifyForms.ts). Keep these field names in sync with the keys
      sent from data.ts. Submissions appear in Netlify → Site → Forms.
    -->
    <form name="eligibility" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="eligibility" />
      <input type="text" name="bot-field" />
      <input type="text" name="application_reference" />
      <input type="text" name="profile_stage" />
      <input type="text" name="full_name" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="highest_qualification" />
      <input type="text" name="selected_pathway" />
      <input type="text" name="years_experience" />
      <input type="text" name="role" />
      <input type="text" name="experiences" />
      <input type="text" name="result" />
      <input type="text" name="consent" />
      <input type="text" name="preferred_language" />
      <input type="text" name="lead_source" />
      <input type="text" name="location" />
      <input type="text" name="business_or_organisation_name" />
      <input type="text" name="current_position" />
      <input type="text" name="industry" />
      <input type="text" name="team_size" />
      <textarea name="motivation"></textarea>
      <input type="text" name="commitment_level" />
      <input type="text" name="financial_readiness" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
